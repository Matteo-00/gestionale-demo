<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestionale Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #18181b;
      -webkit-font-smoothing: antialiased;
    }

    .loader-container {
      text-align: center;
      max-width: 400px;
      padding: 2rem;
    }

    .loader-logo {
      font-size: 2rem;
      font-weight: 700;
      color: #18181b;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }

    .loader-progress {
      width: 100%;
      height: 3px;
      background: #e4e4e7;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .loader-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #18181b 0%, #71717a 100%);
      width: 0%;
      animation: progress 1.5s ease-in-out infinite;
    }

    @keyframes progress {
      0% { width: 0%; transform: translateX(0); }
      50% { width: 70%; }
      100% { width: 100%; transform: translateX(0); }
    }

    .loader-text {
      font-size: 0.875rem;
      color: #71717a;
      font-weight: 500;
    }

    .loader-subtext {
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-top: 0.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loader-container {
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="loader-logo">Gestionale Demo</div>
    <div class="loader-progress">
      <div class="loader-progress-bar"></div>
    </div>
    <div class="loader-text" id="loaderText">Caricamento in corso...</div>
    <div class="loader-subtext" id="loaderSubtext">Verifica configurazione</div>
  </div>

  <script src="js/theme-manager-v2.js"></script>
  <script>
    setTimeout(() => {
      const isConfigured = themeManager.isConfigured();
      const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
      
      if (isLoggedIn && sessionStorage.getItem('accessToken')) {
        document.getElementById('loaderText').textContent = 'Accesso dashboard';
        document.getElementById('loaderSubtext').textContent = 'Reindirizzamento...';
        setTimeout(() => window.location.href = 'index.html', 300);
      } else if (!isConfigured) {
        document.getElementById('loaderText').textContent = 'Configurazione iniziale';
        document.getElementById('loaderSubtext').textContent = 'Reindirizzamento...';
        setTimeout(() => window.location.href = 'setup-premium.html', 300);
      } else {
        document.getElementById('loaderText').textContent = 'Pronto';
        document.getElementById('loaderSubtext').textContent = 'Reindirizzamento al login...';
        setTimeout(() => window.location.href = 'login.html', 300);
      }
    }, 800);
  </script>
</body>
</html>
